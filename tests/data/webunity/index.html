<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<script>
fetch('app.wasm').then(function(r){
  return r.arrayBuffer().then(function(b){
    document.title = 'WASM:ct=' + r.headers.get('Content-Type') +
      ';len=' + r.headers.get('Content-Length') + ';bytes=' + b.byteLength;
  });
}).catch(function(e){ document.title = 'WASM:ERR:' + e; });
</script>
</body>
</html>
