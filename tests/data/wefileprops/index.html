<!DOCTYPE html>
<html>
<head><title>wefileprops</title></head>
<body>
<script>
/* Fetch whatever the daemon delivered as the file property value and report
 * into the title. Relative defaults resolve against the document URL; the
 * daemon rewrites absolute/file:// picks to localhost alias URLs because an
 * http-origin page cannot touch those at all. */
window.wallpaperPropertyListener = {
  applyUserProperties: function (p) {
    try {
      var v = p && p.pic && p.pic.value;
      if (!v) {
        document.title = 'FILE:none';
        return;
      }
      fetch(v).then(function (r) {
        if (!r.ok)
          throw new Error('http ' + r.status);
        return r.arrayBuffer();
      }).then(function (b) {
        document.title = 'FILE:ok:' + b.byteLength + ':' + v;
      }).catch(function (e) {
        document.title = 'FILE:err:' + v;
      });
    } catch (e) {
      document.title = 'FILE:exc';
    }
  }
};
</script>
</body>
</html>
